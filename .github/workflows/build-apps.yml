name: Build sideload apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: webeasy-android-development-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.20
      - run: npm run package:website
      - name: Test website file paths
        run: |
          swiftc -swift-version 6 apps/ios/Sources/UiText.swift apps/ios/Tests/UiTextTests.swift -o "$RUNNER_TEMP/webeasy-ui-tests"
          "$RUNNER_TEMP/webeasy-ui-tests"
          swiftc -swift-version 6 apps/ios/Sources/ContentSlugs.swift apps/ios/Tests/ContentSlugsTests.swift -o "$RUNNER_TEMP/webeasy-slug-tests"
          swiftc -swift-version 6 apps/ios/Sources/ContentError.swift apps/ios/Sources/CustomizationAssets.swift apps/ios/Sources/DirectoryTools.swift apps/ios/Sources/HostingDirectory.swift apps/ios/Tests/DirectoryToolsTests.swift -o "$RUNNER_TEMP/webeasy-directory-tests"
          "$RUNNER_TEMP/webeasy-directory-tests"
          "$RUNNER_TEMP/webeasy-slug-tests"
          swiftc -swift-version 6 apps/ios/Sources/WebsiteFiles.swift apps/ios/Tests/WebsiteFilesTests.swift -o "$RUNNER_TEMP/webeasy-file-tests"
          "$RUNNER_TEMP/webeasy-file-tests"
          swiftc -swift-version 6 apps/ios/Sources/PublishingOperation.swift apps/ios/Sources/PublishingPaths.swift apps/ios/Tests/PublishingOperationTests.swift -o "$RUNNER_TEMP/webeasy-publishing-tests"
          "$RUNNER_TEMP/webeasy-publishing-tests"
          mkdir -p dist/native-renderer-tests
          for source in shared/renderer/renderer.c shared/renderer/vendor/mustach/mustach.c shared/renderer/vendor/cjson/cJSON.c; do
            cc -std=c11 -DNO_OPEN_MEMSTREAM -Ishared/renderer/vendor/mustach -Ishared/renderer/vendor/cjson -c "$source" -o "dist/native-renderer-tests/$(basename "$source" .c).o"
          done
          swiftc -swift-version 6 -import-objc-header apps/ios/Sources/Webeasy-Bridging-Header.h apps/ios/Sources/ContentError.swift apps/ios/Sources/NativeRenderer.swift apps/ios/Tests/NativeRendererTests.swift dist/native-renderer-tests/renderer.o dist/native-renderer-tests/mustach.o dist/native-renderer-tests/cJSON.o -o dist/native-renderer-tests/swift-tests
          dist/native-renderer-tests/swift-tests
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/ios
      - run: >-
          xcodebuild -project Webeasy.xcodeproj -scheme Webeasy
          -destination 'generic/platform=iOS' -sdk iphoneos -configuration Release
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          "CURRENT_PROJECT_VERSION=${{ github.run_number }}" build
        working-directory: apps/ios
      - name: Package unsigned IPA for SideStore/AltStore
        working-directory: apps/ios
        run: |
          mkdir -p build/ipa/Payload
          ditto build/Build/Products/Release-iphoneos/Webeasy.app build/ipa/Payload/Webeasy.app
          cd build/ipa
          zip -qry ../Webeasy.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: webeasy-ios-sidestore-ipa
          path: apps/ios/build/Webeasy.ipa
          if-no-files-found: error

name: Webeasy
options:
  bundleIdPrefix: no.webeasy
  deploymentTarget:
    iOS: "17.0"
packages:
  FilesProvider:
    url: https://github.com/amosavian/FileProvider.git
    exactVersion: 0.26.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1
targets:
  Webeasy:
    type: application
    platform: iOS
    dependencies:
      - sdk: libsqlite3.tbd
      - package: FilesProvider
      - package: Citadel
    sources:
      - Sources
      - path: Resources/Website
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build and package website
        script: |
          set -eu
          cd "${SRCROOT}/../.."
          npm run package:website
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.webeasy.app
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.3"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: Take a picture of your hosting setup QR code.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Publish your website to hosting on your local network.

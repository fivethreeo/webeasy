<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; media-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'">
  <title>Content field</title>
  <link rel="stylesheet" href="assets/field.css"><script defer src="assets/field.js"></script>
</head><body>
  <div id="field" class="field-shell"></div>
  <p id="status" role="status"></p>
  <dialog id="media-details"><form class="stack" method="dialog">
    <h2>Figure details</h2>
    <label class="stack">File basename (optional)<input id="media-basename" type="text" maxlength="80" pattern="[A-Za-z0-9][A-Za-z0-9_\-]{0,79}" autocapitalize="none" spellcheck="false" aria-describedby="media-basename-help"></label>
    <p id="media-basename-help">Leave blank for an automatic name. Use letters, numbers, hyphens, or underscores, without an extension. Duplicate names get a number.</p>
    <label class="stack">Alternative text (images)<input id="media-alt" type="text"></label>
    <label class="stack">Caption (optional)<input id="media-caption" type="text"></label>
    <p>MP4 is recommended for videos.</p>
    <div class="cluster"><button value="insert">Insert figure</button><button value="cancel">Cancel</button></div>
  </form></dialog>
</body></html>

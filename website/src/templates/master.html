<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title><base href="{{baseHref}}">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; media-src 'self'; base-uri 'self'; object-src 'none'">
<link rel="stylesheet" href="assets/site.css"><script defer src="assets/site.js"></script>
</head><body>
{{#hasLandingCover}}
<main class="stack content-blocks landing-shell">
  <div class="cover-layout landing-cover">
    <div class="center stack site-shell published-shell">
      {{#page.cover}}<img class="landing-cover-image" src="{{src}}" alt="{{alt}}">{{/page.cover}}
      {{{navigation}}}
    </div>
    <div class="center stack site-shell published-shell center:text cover-center">
      <header class="stack center:intrinsic jumbotron">
        <h1>{{page.title}}</h1>
        {{#page.subtitle}}<p class="secondary-title">{{page.subtitle}}</p>{{/page.subtitle}}
      </header>
    </div>
  </div>
  <div class="center stack site-shell published-shell">{{{content}}}</div>
</main>
{{/hasLandingCover}}
{{^hasLandingCover}}<main class="center stack site-shell published-shell">{{{navigation}}}{{{content}}}</main>{{/hasLandingCover}}
{{>site-footer}}</body></html>
